<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlanlar | Admin Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>
  <div class="min-h-screen bg-[#0A0A12] font-sans text-white grid-glow">
    <aside id="admin-sidebar" class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-white/10 bg-[#0E0E18] px-4 py-6 transition-transform lg:translate-x-0">
      <div class="flex items-center gap-3 px-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-amber-500 text-xl font-extrabold text-black">E</span>
        <div><strong class="block text-sm tracking-tight">EMİN EMLAK</strong><small class="text-[9px] uppercase tracking-[.24em] text-amber-400">Yönetim Paneli</small></div>
      </div>
      <div class="mt-10 px-3 text-[10px] font-semibold uppercase tracking-[.22em] text-white/30">Ana menü</div>
      <nav class="mt-3 space-y-1">
        <a href="dashboard.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-white/55"><iconify-icon icon="lucide:layout-dashboard" class="text-lg"></iconify-icon> Dashboard</a>
        <a href="ilanlar.html" class="sidebar-link active flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><iconify-icon icon="lucide:building-2" class="text-lg"></iconify-icon> İlanlar <span class="ml-auto rounded-full bg-amber-500/15 px-2 py-0.5 text-[10px] text-amber-400" id="sidebar-listing-count">0</span></a>
        <a href="mesajlar.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-white/55"><iconify-icon icon="lucide:inbox" class="text-lg"></iconify-icon> Mesajlar <span class="ml-auto rounded-full bg-amber-500 px-2 py-0.5 text-[10px] font-bold text-black" id="sidebar-message-count">0</span></a>
        <a href="ayarlar.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-white/55"><iconify-icon icon="lucide:settings-2" class="text-lg"></iconify-icon> Ayarlar</a>
      </nav>
    </aside>

    <div class="lg:pl-64">
      <header class="sticky top-0 z-30 flex h-20 items-center justify-between border-b border-white/10 bg-[#0A0A12] px-5 sm:px-8">
        <div class="flex items-center gap-4"><button id="mobile-menu-btn" class="flex h-10 w-10 items-center justify-center rounded-lg border border-white/10 text-white/70 lg:hidden"><iconify-icon icon="lucide:menu" class="text-xl"></iconify-icon></button><div><h1 class="text-xl font-bold tracking-tight">İlan Yönetimi</h1></div></div>
        <a href="ilan-ekle.html" class="inline-flex items-center gap-2 rounded-lg bg-amber-500 px-4 py-2.5 text-sm font-bold text-black hover:bg-amber-400"><iconify-icon icon="lucide:plus"></iconify-icon> Yeni İlan Ekle</a>
      </header>

      <main class="mx-auto max-w-[1440px] px-5 py-8 sm:px-8">
        <section class="glass overflow-hidden rounded-2xl">
          <div class="flex flex-col gap-4 border-b border-white/10 p-5 sm:flex-row sm:items-center sm:justify-between">
            <label class="flex items-center gap-2 rounded-lg border border-white/10 bg-white/[.04] px-3 py-2 text-white/40">
              <iconify-icon icon="lucide:search"></iconify-icon>
              <input type="text" id="search-input" class="w-full sm:w-64 bg-transparent text-sm text-white outline-none placeholder:text-white/30" placeholder="İlan başlığı ara...">
            </label>
            <div class="flex items-center gap-2">
              <select id="filter-type" class="rounded-lg border border-white/10 bg-[#191927] px-3 py-2 text-xs text-white outline-none">
                <option value="">Tümü (Satılık/Kiralık)</option>
                <option value="satilik">Satılık</option>
                <option value="kiralik">Kiralık</option>
              </select>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full min-w-[720px] text-left">
              <thead class="bg-white/[.025] text-[10px] uppercase tracking-wider text-white/35">
                <tr>
                  <th class="px-5 py-4 font-semibold">İlan</th>
                  <th class="px-4 py-4 font-semibold">Durum</th>
                  <th class="px-4 py-4 font-semibold">Fiyat</th>
                  <th class="px-4 py-4 font-semibold">Tarih</th>
                  <th class="px-5 py-4 text-right font-semibold">İşlem</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-white/5" id="listings-table-body">
                <!-- JS Rendered -->
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  
  <script src="../js/utils.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await DataManager.init();
      AdminApp.initListingsPage();
      
      const sidebar = document.getElementById('admin-sidebar');
      document.getElementById('mobile-menu-btn')?.addEventListener('click', () => sidebar.classList.toggle('-translate-x-full'));
    });
  </script>
    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/905550137647?text=Merhaba,%20ilanlar%20hakkında%20bilgi%20almak%20istiyorum." target="_blank" class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-[#25D366] text-white shadow-lg transition hover:scale-110 hover:bg-[#128C7E]" style="box-shadow: 0 4px 14px rgba(37,211,102,0.4);">
      <iconify-icon icon="ic:baseline-whatsapp" class="text-3xl"></iconify-icon>
    </a>
</body>
</html>
