<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satılık İlanlar | Emin Emlak Nusaybin</title>
  <meta name="description" content="Nusaybin ve Mardin'de satılık ev, daire, arsa ve iş yeri ilanları.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { brand: ['Barlow Condensed','sans-serif'], body: ['Inter','sans-serif'] },
      colors: { mint: '#7ECA9C', 'mint-dark': '#5EAD80', navy: '#202a44', 'navy-deep': '#1a2238', marble: '#f5f5f5', graphite: '#494949', steel: '#7d7d7d', ash: '#969696', anvil: '#313131' }
    }}}
  </script>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="min-h-screen bg-white font-body text-navy">
    <header class="fixed top-0 left-0 right-0 z-50 bg-navy-deep border-b border-graphite/40">
      <div class="mx-auto flex h-16 max-w-[1440px] items-center justify-between px-6 lg:px-10">
        <a href="index.html" class="flex items-center gap-3"><img src="assets/logo.jpeg" alt="Emin Emlak Logo" class="h-12 w-auto object-contain" onerror="this.style.display='none'"><span><strong class="block font-brand text-sm uppercase tracking-[0.023em] text-white">EMİN EMLAK</strong><small class="block font-brand text-[10px] uppercase tracking-[0.12em] text-mint">Nusaybin · Mardin</small></span></a>
        <nav class="hidden items-center gap-8 lg:flex">
          <a href="ilanlar.html" class="font-brand text-[13px] uppercase tracking-[0.023em] text-white/60 transition hover:text-mint">İlanlar</a>
          <a href="satilik.html" class="font-brand text-[13px] uppercase tracking-[0.023em] text-mint transition">Satılık</a>
          <a href="kiralik.html" class="font-brand text-[13px] uppercase tracking-[0.023em] text-white/60 transition hover:text-mint">Kiralık</a>
          <a href="hakkimizda.html" class="font-brand text-[13px] uppercase tracking-[0.023em] text-white/60 transition hover:text-mint">Hakkımızda</a>
          <a href="iletisim.html" class="font-brand text-[13px] uppercase tracking-[0.023em] text-white/60 transition hover:text-mint">İletişim</a>
        </nav>
      </div>
      <!-- Mobile nav -->
      <nav id="mobile-nav" class="hidden border-t border-graphite/40 bg-navy-deep px-6 py-4 lg:hidden">
        <a href="ilanlar.html" class="block py-2 font-brand text-sm uppercase tracking-[0.023em] text-white/60">İlanlar</a>
        <a href="satilik.html" class="block py-2 font-brand text-sm uppercase tracking-[0.023em] text-white/60">Satılık</a>
        <a href="kiralik.html" class="block py-2 font-brand text-sm uppercase tracking-[0.023em] text-white/60">Kiralık</a>
        <a href="hakkimizda.html" class="block py-2 font-brand text-sm uppercase tracking-[0.023em] text-white/60">Hakkımızda</a>
        <a href="iletisim.html" class="block py-2 font-brand text-sm uppercase tracking-[0.023em] text-white/60">İletişim</a>
      </nav>
    </header>
    <main class="pt-16">
      <section class="relative overflow-hidden bg-navy border-b border-ash/30 px-6 py-16 lg:px-10">
        <video autoplay loop muted playsinline class="absolute inset-0 h-full w-full object-cover opacity-40">
          <source src="assets/video_drone.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-gradient-to-r from-navy-deep via-navy-deep/60 to-transparent"></div>
        <div class="relative z-10 mx-auto max-w-[1440px] reveal flex flex-col justify-between gap-6 lg:flex-row lg:items-end">
          <div>
            <p class="font-brand text-[12px] uppercase tracking-[0.023em] text-mint">Nusaybin / Mardin</p>
            <h1 class="mt-3 font-brand text-[40px] leading-[1.19] tracking-[0.92px] uppercase md:text-[54px] md:leading-[1.13] text-white">Satılık İlanlar</h1>
            <p class="mt-4 max-w-2xl font-body text-[16px] leading-[1.5] text-white/60">Nusaybin ve çevresindeki en iyi satılık gayrimenkuller.</p>
          </div>
          <span class="font-brand text-[12px] uppercase tracking-[0.023em] text-white/60" id="resultsCount">0 İlan</span>
        </div>
      </section>
      <section class="bg-white px-6 py-10 lg:px-10">
        <div class="mx-auto max-w-[1440px] grid gap-8 lg:grid-cols-[260px_1fr]">
          <aside id="filter-panel" class="hidden h-fit border border-ash/40 p-6 lg:block lg:sticky lg:top-20">
            <input type="hidden" id="filterType" value="satilik">
            <div class="space-y-6">
              <fieldset>
                <legend class="mb-3 font-brand text-[12px] uppercase tracking-[0.023em] text-steel">Kategori</legend>
                <select id="filterCategory" class="w-full border border-ash/40 bg-white px-3 py-3 font-body text-[14px] text-navy outline-none"><option value="">Tümü</option><option value="daire">Daire</option><option value="mustakil">Müstakil Ev</option><option value="arsa">Arsa / Tarla</option><option value="isyeri">İş Yeri</option></select>
              </fieldset>
              <fieldset>
                <legend class="mb-3 font-brand text-[12px] uppercase tracking-[0.023em] text-steel">Oda Sayısı</legend>
                <select id="filterRooms" class="w-full border border-ash/40 bg-white px-3 py-3 font-body text-[14px] text-navy outline-none"><option value="">Tümü</option><option value="1+1">1+1</option><option value="2+1">2+1</option><option value="3+1">3+1</option><option value="4+1">4+1</option></select>
              </fieldset>
              <button id="apply-filters-btn" class="btn-mint w-full justify-center">Filtreleri Uygula</button>
            </div>
          </aside>
          <div id="listingsGrid" class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3"></div>
        </div>
      </section>
    </main>
    <footer class="bg-navy-deep border-t border-graphite/40 px-6 py-14 lg:px-10">
      <div class="mx-auto max-w-[1440px] font-brand text-[10px] uppercase tracking-[0.023em] text-white/25">© 2024 Emin Emlak. Tüm Hakları Saklıdır.</div>
    </footer>
  </div>
  <script src="js/utils.js"></script><script src="js/data.js"></script><script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await DataManager.init();
      document.getElementById('apply-filters-btn').addEventListener('click', App.renderTailwindListings);
      App.renderTailwindListings();
    });
  </script>
    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/905550137647?text=Merhaba,%20ilanlar%20hakkında%20bilgi%20almak%20istiyorum." target="_blank" class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-[#25D366] text-white shadow-lg transition hover:scale-110 hover:bg-[#128C7E]" style="box-shadow: 0 4px 14px rgba(37,211,102,0.4);">
      <iconify-icon icon="ic:baseline-whatsapp" class="text-3xl"></iconify-icon>
    </a>
</body>
</html>
