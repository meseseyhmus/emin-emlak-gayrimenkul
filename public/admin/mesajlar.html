<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesajlar | Admin Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>
  <div class="min-h-screen bg-[#0A0A12] font-sans text-white grid-glow">
    <aside id="admin-sidebar" class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-white/10 bg-[#0E0E18] px-4 py-6 transition-transform lg:translate-x-0">
      <div class="flex items-center gap-3 px-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-amber-500 text-xl font-extrabold text-black">E</span>
        <div><strong class="block text-sm tracking-tight">EMİN EMLAK</strong><small class="text-[9px] uppercase tracking-[.24em] text-amber-400">Yönetim Paneli</small></div>
      </div>
      <div class="mt-10 px-3 text-[10px] font-semibold uppercase tracking-[.22em] text-white/30">Ana menü</div>
      <nav class="mt-3 space-y-1">
        <a href="dashboard.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-white/55"><iconify-icon icon="lucide:layout-dashboard" class="text-lg"></iconify-icon> Dashboard</a>
        <a href="ilanlar.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-white/55"><iconify-icon icon="lucide:building-2" class="text-lg"></iconify-icon> İlanlar</a>
        <a href="mesajlar.html" class="sidebar-link active flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><iconify-icon icon="lucide:inbox" class="text-lg"></iconify-icon> Mesajlar <span class="ml-auto rounded-full bg-amber-500 px-2 py-0.5 text-[10px] font-bold text-black" id="sidebar-message-count">0</span></a>
        <a href="ayarlar.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-white/55"><iconify-icon icon="lucide:settings-2" class="text-lg"></iconify-icon> Ayarlar</a>
      </nav>
    </aside>

    <div class="lg:pl-64">
      <header class="sticky top-0 z-30 flex h-20 items-center justify-between border-b border-white/10 bg-[#0A0A12] px-5 sm:px-8">
        <div class="flex items-center gap-4"><button id="mobile-menu-btn" class="flex h-10 w-10 items-center justify-center rounded-lg border border-white/10 text-white/70 lg:hidden"><iconify-icon icon="lucide:menu" class="text-xl"></iconify-icon></button><div><h1 class="text-xl font-bold tracking-tight">Mesajlar</h1></div></div>
        <button id="mark-all-read-btn" class="rounded-lg border border-white/10 px-4 py-2.5 text-xs font-semibold text-white/55 hover:border-amber-400 hover:text-amber-400">Tümünü okundu işaretle</button>
      </header>

      <main class="mx-auto max-w-[1000px] px-5 py-8 sm:px-8">
        <section class="glass rounded-2xl">
          <div class="divide-y divide-white/5" id="messages-list">
            <!-- JS Rendered -->
          </div>
        </section>
      </main>
    </div>
  </div>
  
  <script src="../js/utils.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await DataManager.init();
      AdminApp.initMessagesPage();
      
      const sidebar = document.getElementById('admin-sidebar');
      document.getElementById('mobile-menu-btn')?.addEventListener('click', () => sidebar.classList.toggle('-translate-x-full'));
    });
  </script>
    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/905550137647?text=Merhaba,%20ilanlar%20hakkında%20bilgi%20almak%20istiyorum." target="_blank" class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-[#25D366] text-white shadow-lg transition hover:scale-110 hover:bg-[#128C7E]" style="box-shadow: 0 4px 14px rgba(37,211,102,0.4);">
      <iconify-icon icon="ic:baseline-whatsapp" class="text-3xl"></iconify-icon>
    </a>
</body>
</html>
