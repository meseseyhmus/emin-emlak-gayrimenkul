<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayarlar | Admin Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>
  <div class="min-h-screen bg-[#0A0A12] font-sans text-white grid-glow">
    <aside id="admin-sidebar" class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-white/10 bg-[#0E0E18] px-4 py-6 transition-transform lg:translate-x-0">
      <div class="flex items-center gap-3 px-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-amber-500 text-xl font-extrabold text-black">E</span>
        <div><strong class="block text-sm tracking-tight">EMİN EMLAK</strong><small class="text-[9px] uppercase tracking-[.24em] text-amber-400">Yönetim Paneli</small></div>
      </div>
      <div class="mt-10 px-3 text-[10px] font-semibold uppercase tracking-[.22em] text-white/30">Ana menü</div>
      <nav class="mt-3 space-y-1">
        <a href="dashboard.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-white/55"><iconify-icon icon="lucide:layout-dashboard" class="text-lg"></iconify-icon> Dashboard</a>
        <a href="ilanlar.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-white/55"><iconify-icon icon="lucide:building-2" class="text-lg"></iconify-icon> İlanlar</a>
        <a href="mesajlar.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-white/55"><iconify-icon icon="lucide:inbox" class="text-lg"></iconify-icon> Mesajlar</a>
        <a href="ayarlar.html" class="sidebar-link active flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><iconify-icon icon="lucide:settings-2" class="text-lg"></iconify-icon> Ayarlar</a>
      </nav>
    </aside>

    <div class="lg:pl-64">
      <header class="sticky top-0 z-30 flex h-20 items-center justify-between border-b border-white/10 bg-[#0A0A12] px-5 sm:px-8">
        <div class="flex items-center gap-4"><button id="mobile-menu-btn" class="flex h-10 w-10 items-center justify-center rounded-lg border border-white/10 text-white/70 lg:hidden"><iconify-icon icon="lucide:menu" class="text-xl"></iconify-icon></button><div><h1 class="text-xl font-bold tracking-tight">Ayarlar</h1></div></div>
      </header>

      <main class="mx-auto max-w-[800px] px-5 py-8 sm:px-8">
        <form id="settings-form" class="space-y-8">
          <section class="glass rounded-2xl p-6 md:p-8">
            <h2 class="text-lg font-bold mb-6">İletişim Bilgileri (Site Genelinde Gösterilir)</h2>
            <div class="grid gap-5">
              <label class="block">
                <span class="mb-2 block text-xs font-semibold uppercase tracking-wider text-white/45">Telefon Numaranız</span>
                <input type="text" id="phone" class="w-full rounded-lg border border-white/10 bg-white/[.04] px-4 py-3.5 text-sm text-white outline-none focus:border-amber-400">
              </label>

              <label class="block">
                <span class="mb-2 block text-xs font-semibold uppercase tracking-wider text-white/45">Açık Adresiniz</span>
                <input type="text" id="address" class="w-full rounded-lg border border-white/10 bg-white/[.04] px-4 py-3.5 text-sm text-white outline-none focus:border-amber-400">
              </label>
            </div>
            
            <div class="mt-8 pt-8 border-t border-white/10">
              <h2 class="text-lg font-bold mb-6">Admin Giriş Bilgileri</h2>
              <div class="grid gap-5">
                <label class="block">
                  <span class="mb-2 block text-xs font-semibold uppercase tracking-wider text-white/45">Kullanıcı Adı</span>
                  <input type="text" id="username" class="w-full rounded-lg border border-white/10 bg-white/[.04] px-4 py-3.5 text-sm text-white outline-none focus:border-amber-400">
                </label>
                
                <label class="block">
                  <span class="mb-2 block text-xs font-semibold uppercase tracking-wider text-white/45">Şifre (Değiştirmek istemiyorsanız boş bırakın)</span>
                  <input type="password" id="password" class="w-full rounded-lg border border-white/10 bg-white/[.04] px-4 py-3.5 text-sm text-white outline-none focus:border-amber-400">
                </label>
              </div>
            </div>

            <div class="mt-8 flex items-center gap-4 border-t border-white/10 pt-8">
              <button type="submit" class="rounded-lg bg-amber-500 px-8 py-3.5 font-bold text-black transition hover:bg-amber-400">Ayarları Kaydet</button>
              <span id="settings-success" class="text-green-400 text-sm hidden">Ayarlar güncellendi!</span>
            </div>
          </section>
        </form>
      </main>
    </div>
  </div>
  
  <script src="../js/utils.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await DataManager.init();
      AdminApp.initSettingsPage();
      
      const sidebar = document.getElementById('admin-sidebar');
      document.getElementById('mobile-menu-btn')?.addEventListener('click', () => sidebar.classList.toggle('-translate-x-full'));
    });
  </script>
    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/905550137647?text=Merhaba,%20ilanlar%20hakkında%20bilgi%20almak%20istiyorum." target="_blank" class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-[#25D366] text-white shadow-lg transition hover:scale-110 hover:bg-[#128C7E]" style="box-shadow: 0 4px 14px rgba(37,211,102,0.4);">
      <iconify-icon icon="ic:baseline-whatsapp" class="text-3xl"></iconify-icon>
    </a>
</body>
</html>
